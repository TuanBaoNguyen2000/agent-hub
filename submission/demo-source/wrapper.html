<!doctype html>
<html lang="vi"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>AgentHub · Demo</title>
<!-- Built from the actual renderer, without changing its components or CSS. {{SOURCE_HASH}} -->
<style>
:root{color-scheme:light dark;font:12px -apple-system,BlinkMacSystemFont,'Segoe UI',system-ui,sans-serif;color:light-dark(#6c695f,#a9a69c);background:light-dark(#faf9f5,#262624)}*{box-sizing:border-box}body{margin:0}header{height:36px;min-width:880px;padding:0 16px;display:flex;align-items:center;gap:16px;border-bottom:1px solid light-dark(#dedcd5,#44433d);background:light-dark(#f2f0e9,#1f1e1d)}header strong{font-weight:600;color:light-dark(#1f1e1b,#f2f1ec)}header span{flex:1}button{font:inherit;cursor:pointer;background:transparent;color:inherit;border:0;padding:6px 10px;border-radius:6px;min-height:30px}button:hover{background:light-dark(#e7e4dc,#33332f)}button:focus-visible{outline:2px solid #c2603d;outline-offset:1px}iframe{display:block;border:0;width:100%;min-width:880px;min-height:560px;height:calc(100dvh - 36px);background:light-dark(#faf9f5,#262624)}dialog{width:min(560px,calc(100% - 32px));border:1px solid light-dark(#ddd9d0,#4b4943);border-radius:12px;background:light-dark(#faf9f5,#262624);color:light-dark(#1f1e1b,#f2f1ec);padding:28px;font-size:14px;line-height:1.6}dialog::backdrop{background:#0007}h2{font-size:18px;margin:0 0 16px}p{margin:12px 0;white-space:pre-line}dialog button{background:light-dark(#e8e5dd,#373733);padding:8px 16px;margin-top:12px}#notice{position:fixed;bottom:24px;left:50%;transform:translateX(-50%);z-index:100;background:light-dark(#1f1e1b,#f2f1ec);color:light-dark(#faf9f5,#1f1e1d);padding:12px 18px;border-radius:8px;max-width:calc(100% - 32px);line-height:1.5}[hidden]{display:none!important}
</style></head><body>
<header><strong id="label">AgentHub · Demo</strong><span id="hint">Giao diện thật · Dữ liệu mẫu · Không mở app/AI thật</span><button id="guide-button">Hướng dẫn</button><button id="reset-button">Khôi phục demo</button></header>
<iframe id="demo" title="AgentHub — application demo"></iframe>
<dialog id="guide" aria-labelledby="guide-title"><h2 id="guide-title"></h2><p id="guide-text"></p><button id="guide-close"></button></dialog>
<dialog id="reset" aria-labelledby="reset-title"><h2 id="reset-title"></h2><p id="reset-text"></p><button id="reset-cancel"></button><button id="reset-confirm"></button></dialog>
<div id="notice" role="status" aria-live="polite" hidden></div>
<script>
(()=>{const frame=document.getElementById('demo');const words={vi:{hint:'Giao diện thật · Dữ liệu mẫu · Không mở app/AI thật',guide:'Hướng dẫn',reset:'Khôi phục demo',title:'Dùng thử theo đúng luồng của AgentHub',text:'Đây là giao diện được build trực tiếp từ mã React/CSS của app.\n\n1. Ở Tổng quan, chọn account và Desktop hoặc Terminal để thử mở agent mô phỏng.\n2. Mở tab Task: đổi Danh sách/Bảng, mở task để sửa từng mục, tick tiêu chí hoặc thêm handoff từ bản tóm tắt.\n3. Nút Tài liệu mở cây thư mục và vùng xem/sửa Markdown.\n4. Cài đặt → Account, Công cụ agent, MCP server cho phép xem và thử cấu hình mẫu.\n5. Đổi ngôn ngữ EN/VN/KO và sáng/tối trong Cài đặt → Chung như app thật.\n\nFolder, account, usage, Git và kết quả kết nối đều là dữ liệu giả. Các thao tác cần hệ điều hành chỉ được mô phỏng. Giao diện desktop giữ giới hạn bề rộng 880px như app.',close:'Đóng',resetTitle:'Khôi phục dữ liệu mẫu?',resetText:'Các thay đổi trong bản demo sẽ được thay bằng dữ liệu ban đầu.',cancel:'Huỷ'},en:{hint:'Actual app UI · Sample data · No real app/AI launch',guide:'Guide',reset:'Reset demo',title:'Try AgentHub’s actual workflow',text:'This interface is built directly from the app’s React/CSS source.\n\n1. In Overview, choose an account and Desktop or Terminal to simulate a launch.\n2. Open Tasks: switch List/Board, open a task to edit sections, tick criteria or paste a handoff.\n3. Documents opens the file tree and Markdown viewer/editor.\n4. Settings → Accounts, Agent tools and MCP server show interactive sample settings.\n5. Change EN/VN/KO and light/dark in Settings → General, just like the app.\n\nFolders, accounts, usage, Git and connection results are sample data. OS actions are simulated. The desktop interface keeps the app’s minimum width of 880px.',close:'Close',resetTitle:'Reset to sample data?',resetText:'Your demo changes will be replaced with the initial sample data.',cancel:'Cancel'},ko:{hint:'실제 앱 UI · 샘플 데이터 · 실제 앱/AI 실행 없음',guide:'안내',reset:'데모 초기화',title:'AgentHub의 실제 작업 흐름 체험',text:'앱의 React/CSS 소스에서 직접 빌드한 화면이에요.\n\n1. 개요에서 계정과 데스크톱 또는 터미널을 골라 실행을 체험하세요.\n2. 작업 탭에서 목록/보드를 전환하고 작업을 열어 항목 수정, 완료 기준 체크, 인계 기록 추가를 해보세요.\n3. 문서 버튼으로 폴더 트리와 Markdown 보기/편집 패널을 여세요.\n4. 설정의 계정, 에이전트 도구, MCP 서버에서 샘플 설정을 체험하세요.\n5. 설정 → 일반에서 EN/VN/KO와 라이트/다크를 바꿀 수 있어요.\n\n폴더, 계정, 사용량, Git, 연결 결과는 가상 데이터예요. 운영체제 기능은 시뮬레이션해요. 데스크톱 UI는 실제 앱처럼 최소 너비 880px을 유지해요.',close:'닫기',resetTitle:'샘플 데이터로 초기화할까요?',resetText:'데모에서 변경한 내용을 초기 샘플 데이터로 바꿔요.',cancel:'취소'}};let language='vi',timer;const el=id=>document.getElementById(id);function update(){const w=words[language];document.documentElement.lang=language;el('hint').textContent=w.hint;el('guide-button').textContent=w.guide;el('reset-button').textContent=w.reset;el('guide-title').textContent=w.title;el('guide-text').textContent=w.text;el('guide-close').textContent=w.close;el('reset-title').textContent=w.resetTitle;el('reset-text').textContent=w.resetText;el('reset-cancel').textContent=w.cancel;el('reset-confirm').textContent=w.reset}el('guide-button').onclick=()=>el('guide').showModal();el('guide-close').onclick=()=>el('guide').close();el('reset-button').onclick=()=>el('reset').showModal();el('reset-cancel').onclick=()=>el('reset').close();el('reset-confirm').onclick=()=>{el('reset').close();frame.contentWindow.postMessage({source:'agenthub-demo-wrapper',type:'reset'},'*')};window.addEventListener('message',event=>{if(event.source!==frame.contentWindow||event.data?.source!=='agenthub-demo')return;if(event.data.type==='language'){language=words[event.data.language]?event.data.language:'vi';document.documentElement.style.colorScheme=event.data.theme==='system'?'light dark':event.data.theme;update()}if(event.data.type==='notice'){el('notice').textContent=event.data.text;el('notice').hidden=false;clearTimeout(timer);timer=setTimeout(()=>el('notice').hidden=true,5000)}});update();frame.srcdoc={{APP_HTML_JSON}};})();
</script></body></html>
